<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="../style.css">
  <link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>
  <h1>2FA (Two-Factor Authentication)</h1>
  <form id="content">
    <span>Enter</span>
    <div class="two">
      <input type="password" id="password" placeholder="Password" minlength="1" required autofocus title="min password length is 4 chars for new database generation">
      <input type="button" id="keepasshelper" accesskey="k" title="Use (K)eePassHelper extension to get the Password">
    </div>
    <span>to</span>
    <button type="submit" id="openDB" accesskey="o" disabled><u>O</u>pen a Database</button>
    <button type="button" id="openRemote" accesskey="m" disabled>Open <u>R</u>emote</button>
    <button id="createDB" accesskey="n" disabled>Create a <u>n</u>ew Database</button>
    <span>or use</span>
    <select id="stored" disabled>
      <option>Select Handle</option>
    </select>
    <button id="last" accesskey="l" disabled>Use <u>L</u>ast Handle</button>
  </form>
  <footer>
    <input type="button" id="reset" value="Clear Stored Handles">
  </footer>

  <script src="../aegis/scrypt.umd.min.js"></script>
  <script src="../storage/core.js"></script>
  <script type="module" src="index.mjs"></script>
</body>
</html>
