<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="../style.css">
  <link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>
  <div id="progress"></div>
  <header>
    <h1>2FA (Two-Factor Authentication)</h1>
    <div class="tools">
      <button id="qr" accesskey="i" aria-label="Scan QR code" title="New Item by Scaning QR Code
Select an image with a QR code

Ctrl + I or Command + I">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M5 5h2v2H5zM1 1h10v10H1zm2 2v6h6V3z"/>
          <path d="M5 17h2v2H5zM1 13h10v10H1zm2 2v6h6v-6z"/>
          <path d="M17 5h2v2h-2zM13 1h10v10H13zm2 2v6h6V3z"/>
          <path d="M17 14v3h-3v2h3v3h2v-3h3v-2h-3v-3Z"/>
        </svg>
      </button>
      <button id="new" accesskey="n" aria-label="New item" title="New Item by Inserting OTP URI
Ctrl + N or Command + N">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path fill="currentColor" d="M3 3v19l3-2l3 2l3-2l1.3.86c-.2-.58-.3-1.21-.3-1.86a6.005 6.005 0 0 1 8-5.66V3zm14 4v2H7V7zm-2 4v2H7v-2zm3 4v3h-3v2h3v3h2v-3h3v-2h-3v-3z"/>
        </svg>
      </button>
    </div>
  </header>
  <div id="search-container" title="Press Ctrl + F (or Command + F on Mac) to search. Use the arrow keys to navigate through the items.">
    <input type="search" id="search" autofocus placeholder="Search">
  </div>
  <div id="entries-container">
    <template id="entry">
      <label class="entry">
        <img name="icon" width="24" loading="lazy">
        <span name="name"></span>
        <span name="issuer"></span>
        <span name="groups"></span>
        <input type="radio" name="entry">
      </label>
    </template>
    <div class="entries">
      <label class="header">
        <span></span>
        <span id="sort-by-name">Name</span>
        <span id="sort-by-issuer">Issuer</span>
        <span id="sort-by-groups">Groups</span>
        <span></span>
      </label>
      <fieldset id="tbody"></fieldset>
    </div>
  </div>
  <footer>
    <span id="code">Select an item to show OTP</span>
    <div>
      <button id="save" disabled accesskey="s"><u>S</u>ave Database</button>
      <button id="edit" disabled accesskey="e"><u>E</u>dit</button>
      <button id="delete" disabled accesskey="d"><u>D</u>elete</button>
      <button id="copy" disabled accesskey="c"><u>C</u>opy OTP</button>
    </div>
  </footer>
  <dialog id="editor" popover>
    <form>
      <span>Name</span>
      <input type="text" name="name">
      <span>Issuer</span>
      <input type="text" name="issuer">
      <span>Icon</span>
      <div>
        <template id="img">
          <label class="icon">
            <img width="24" loading="lazy">
            <input type="radio" name="icon">
          </label>
        </template>
        <fieldset name="icons"></fieldset>
        <div name="icon-tools">
          <label class="button">
            <input type="file" name="new-icon" accept="image/*">
            <span>Choose File</span>
          </label>
          <input type="button" name="find-icon" value="Best Match">
          <input type="button" name="remove-icon" value="Remove Icon">
        </div>
      </div>
      <label>Groups <input type="checkbox" name="has-groups"></label>
      <select name="groups" multiple></select>
      <span></span>
      <div>
        <input type="button" name="delete-groups" value="Delete selected Groups">
        <input type="button" name="add-a-group" value="Add a new Group">
      </div>
      <span></span>
      <div>
        <input type="button" name="close" value="Cancel">
        <input type="submit" value="Done">
      </div>
    </form>
  </dialog>

  <script src="../storage/core.js"></script>
  <script src="../aegis/scrypt.umd.min.js"></script>
  <script src="otplib.js"></script>
  <script src="tld.js"></script>
  <script type="module" src="index.mjs"></script>
</body>
</html>
