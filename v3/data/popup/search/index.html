<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="../style.css">
  <link rel="stylesheet" type="text/css" href="index.css">
</head>
<body>
  <div id="progress"></div>
  <h1>2FA (Two-Factor Authentication)</h1>
  <div id="search-container" title="Press Ctrl + F (or Command + F on Mac) to search. Use the arrow keys to navigate through the items.">
    <input type="search" id="search" autofocus placeholder="Search">
  </div>
  <div id="entries-container">
    <template id="entry">
      <label class="entry">
        <img name="icon" width="24">
        <span name="name"></span>
        <span name="issuer"></span>
        <span name="groups"></span>
        <input type="radio" name="entry">
      </label>
    </template>
    <div class="entries">
      <label class="header">
        <span></span>
        <span id="sort-by-name">Name</span>
        <span id="sort-by-issuer">Issuer</span>
        <span id="sort-by-groups">Groups</span>
        <span></span>
      </label>
      <fieldset id="tbody"></fieldset>
    </div>
  </div>
  <footer>
    <span id="code">Select an item to show OTP</span>
    <div>
      <button id="save" disabled accesskey="s"><u>S</u>ave</button>
      <button id="edit" disabled accesskey="e"><u>E</u>dit</button>
      <button id="copy" disabled accesskey="c"><u>C</u>opy</button>
      <button id="new" disabled accesskey="n"><u>N</u>ew</button>
    </div>
  </footer>
  <dialog id="editor" popover>
    <form>
      <span>Name</span>
      <input type="text" name="name">
      <span>Issuer</span>
      <input type="text" name="issuer">
      <span>Icon</span>
      <div>
        <template id="img">
          <label class="icon">
            <img width="16">
            <input type="radio" name="icon">
          </label>
        </template>
        <fieldset name="icons"></fieldset>
        <label class="button">
          <input type="file" name="new-icon" accept="image/*">
          <span>Choose File</span>
        </label>
        <input type="button" name="remove-icon" value="Remove">
      </div>
      <label>Groups <input type="checkbox" name="has-groups"></label>
      <select name="groups" multiple></select>
      <span></span>
      <div>
        <input type="button" name="delete-groups" value="Delete selected Groups">
        <input type="button" name="add-a-group" value="Add a new Group">
      </div>
      <span></span>
      <div>
        <input type="button" name="close" value="Cancel">
        <input type="submit" value="Done">
      </div>
    </form>
  </dialog>

  <script src="../storage/core.js"></script>
  <script src="../aegis/scrypt.umd.min.js"></script>
  <script src="otplib.js"></script>
  <script type="module" src="index.mjs"></script>
</body>
</html>
